<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090a0f" />
    <title>NOMAD Music</title>
    <script>
      // Compatibility fallbacks for legacy render paths that reference helpers
      // outside App's lexical scope. Keep these tiny and dependency-free.
      window.artStyle = function (track) {
        return track && track.artwork_url
          ? { backgroundImage: `url(${track.artwork_url})` }
          : undefined;
      };
      window.artistOf = function (track) {
        return (track && track.artist_name) || "Unknown artist";
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
